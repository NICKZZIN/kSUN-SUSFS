name: Build Kernel

on:
  push:
    branches: [ lineage-23.2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            git gnupg gperf libelf-dev libncurses5-dev \
            libssl-dev python3 python-is-python3 zip \
            android-sdk-libsparse-utils \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Cache Clang toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/clang
          key: clang-r547379

      - name: Install mkdtimg
        run: |
          git clone https://android.googlesource.com/platform/system/libufdt /tmp/libufdt
          sudo cp /tmp/libufdt/utils/src/mkdtboimg.py /usr/local/bin/mkdtimg
          sudo chmod +x /usr/local/bin/mkdtimg
      
      - name: Inject KernelSU & SUSFS
        run: |
          # 1. Instalação do Wild_KSU
          echo "=== Instalando Wild_KSU ==="
          curl -LSs "https://raw.githubusercontent.com/cyberc3dr/Wild_KSU/refs/heads/stable/kernel/setup.sh" | bash -s stable
          
          # 2. Aplicar o primeiro Patch (O que já cria os arquivos .h e o código do SUSFS)
          echo "=== Aplicando Patch SUSFS 5.4 ==="
          curl -LSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Patch/susfs_patch_to_5.4.patch" -o susfs.patch
          patch -p1 < susfs.patch

          # 3. Aplicar o segundo Patch (Inline Hooks via Script)
          echo "=== Aplicando Inline Hooks Patches ==="
          curl -LSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/susfs_inline_hook_patches.sh" | bash

          # 4. Fixes de compatibilidade do Wild_KSU (strncpy)
          echo "=== Corrigindo compatibilidade Xiaomi 5.4 ==="
          KSU_DIR="drivers/kernelsu"
          if [ -d "$KSU_DIR" ]; then
              find "$KSU_DIR" -type f -name "*.c" -exec sed -i 's/strncpy_from_unsafe_user/strncpy_from_user_nofault/g' {}+
              find "$KSU_DIR" -type f -exec sed -i 's/CONFIG_KPROBES/CONFIG_KSU_BOGUS/g' {}+
          fi

          # 5. Finalizar e salvar alterações
          git config --global user.email "bot@github.com"
          git config --global user.name "GitHub Actions"
          git add .
          git commit -m "Integrate Wild_KSU + SUSFS via provided patches" || true
          
      - name: Download AOSP Clang r547379
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/clang
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz" -o /tmp/clang.tar.gz
          tar -xzf /tmp/clang.tar.gz -C $HOME/clang
          rm /tmp/clang.tar.gz

      - name: Add Clang to PATH
        run: echo "$HOME/clang/bin" >> $GITHUB_PATH

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      - name: Configure ccache
        run: |
          ccache -M 5G
          ccache -o compression=true
          ccache -o compiler_check=content
          ccache -z
          echo "=== ccache config ==="
          ccache -p | grep -E "max_size|compression"

      - name: Verify toolchain
        run: |
          echo "=== Clang version ==="
          clang --version
          echo "=== LLD version ==="
          ld.lld --version || true
          echo "=== Tools ==="
          which clang ld.lld llvm-ar llvm-nm llvm-objcopy || true

      - name: Generate defconfig
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            stone_defconfig

      - name: Configure kernel options
        run: |
          # Enable options without modifying defconfig
          scripts/config --file out/.config \
            --enable CONFIG_KSU \
            --enable CONFIG_COMPAT_VDSO \
            --enable CONFIG_SHADOW_CALL_STACK \
            --enable CONFIG_SHADOW_CALL_STACK_VMAP \
            --enable CONFIG_LTO_CLANG \
            --disable CONFIG_LTO_NONE \
            --disable CONFIG_CFI_CLANG \
            --enable CONFIG_RELR \
            --enable CONFIG_THINLTO

          # Resolve dependencies non-interactively
          make O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

      - name: Verify kernel config
        run: |
          echo "=== Checking critical configs ==="
          grep -E "CONFIG_COMPAT_VDSO|CONFIG_SHADOW_CALL_STACK|CONFIG_SHADOW_CALL_STACK_VMAP|CONFIG_LTO_CLANG|CONFIG_LTO_NONE|CONFIG_CFI_CLANG|CONFIG_RELR|CONFIG_THINLTO" out/.config
          echo ""
          declare -A expected=(
            ["CONFIG_KSU"]=y
            ["CONFIG_COMPAT_VDSO"]=y
            ["CONFIG_SHADOW_CALL_STACK"]=y
            ["CONFIG_SHADOW_CALL_STACK_VMAP"]=y
            ["CONFIG_LTO_CLANG"]=y
            ["CONFIG_RELR"]=y
            ["CONFIG_THINLTO"]=y
          )
          declare -A disabled=(
            ["CONFIG_CFI_CLANG"]=1
            ["CONFIG_LTO_NONE"]=1
          )
          for cfg in "${!expected[@]}"; do
            if grep -q "${cfg}=y" out/.config; then
              echo "✅ ${cfg} is enabled"
            else
              echo "❌ ${cfg} is NOT enabled!"
              exit 1
            fi
          done
          for cfg in "${!disabled[@]}"; do
            if grep -q "${cfg}=y" out/.config; then
              echo "❌ ${cfg} should be disabled but is enabled!"
              exit 1
            else
              echo "✅ ${cfg} is disabled"
            fi
          done

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          echo "" > .scmversion
          make O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            -j$(nproc --all) \
            2>&1 | tee build.log

      - name: Print ccache stats
        if: always()
        run: ccache -s

      - name: Check build status
        run: |
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "❌ Kernel build failed! Image not found."
            echo ""
            echo "=== Last 100 lines of build log ==="
            tail -100 build.log
            exit 1
          fi
          echo "✅ Kernel built successfully!"
          
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-completo-${{ github.sha }}
          path: build.log
          retention-days: 7
          
      - name: Package with AnyKernel3
        run: |
          # 1. Baixar o seu AnyKernel3
          git clone https://github.com/NICKZZIN/ANYKERNEL3-C137 AK3
          
          # 2. Copiar a Image principal
          cp out/arch/arm64/boot/Image AK3/
          
          # 3. Copiar dtbo.img se o seu kernel tiver gerado
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img AK3/
          fi
          
          # 4. Copiar os arquivos .dtb
          if ls out/arch/arm64/boot/dts/vendor/qcom/*.dtb 1>/dev/null 2>&1; then
            cp out/arch/arm64/boot/dts/vendor/qcom/*.dtb AK3/dtb/ || true
          elif ls out/arch/arm64/boot/dts/vendor/xiaomi/*.dtb 1>/dev/null 2>&1; then
            cp out/arch/arm64/boot/dts/vendor/xiaomi/*.dtb AK3/dtb/ || true
          fi
          
          # 5. Limpar arquivos desnecessários (para o GitHub zipar apenas o que importa)
          rm -rf AK3/.git AK3/README.md AK3/*placeholder

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-C137-KSU
          path: AK3/
          retention-days: 30
