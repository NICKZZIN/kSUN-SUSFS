name: Build Kernel

on:
  push:
    branches: [ lineage-23.2, lineage-23.2-ksu ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            git gnupg gperf libelf-dev libncurses5-dev \
            libssl-dev python3 python-is-python3 zip \
            android-sdk-libsparse-utils \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Cache Clang toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/clang
          key: clang-r547379

      - name: Install mkdtimg
        run: |
          git clone https://android.googlesource.com/platform/system/libufdt /tmp/libufdt
          sudo cp /tmp/libufdt/utils/src/mkdtboimg.py /usr/local/bin/mkdtimg
          sudo chmod +x /usr/local/bin/mkdtimg
      
      - name: Inject KernelSU-Next (sidex15 Hybrid) & Force Flags
        run: |
          echo "=== 1. Limpeza de resquícios ==="
          sed -i '/kernelsu/d' fs/Makefile fs/Kconfig drivers/Makefile drivers/Kconfig || true
          sed -i '/KernelSU/d' fs/Makefile fs/Kconfig drivers/Makefile drivers/Kconfig || true
          rm -rf drivers/kernelsu KernelSU-Next KernelSU drivers/KernelSU susfs_5.4.patch
          
          echo "=== 2. Instalando Base Stable via Script Oficial ==="
          # Usa o script da branch stable como base de estrutura
          curl -fLSs "https://raw.githubusercontent.com/sidex15/KernelSU-Next/refs/heads/stable/kernel/setup.sh" | bash -s stable

          echo "=== 3. Sobrepondo com sidex15 Legacy-SUSFS-v2 ==="
          # O script do sidex15 instala em drivers/kernelsu
          cd drivers/kernelsu
          git remote add origin_legacy https://github.com/sidex15/KernelSU-Next
          git fetch origin_legacy legacy-susfs-v2
          
          # Força a sobreposição total (Frankenstein)
          git checkout origin_legacy/legacy-susfs-v2 -- .
          cd ../..

          echo "=== 4. Declarando Flags no Kconfig ==="
          # O setup.sh já integrou o Kconfig no drivers/Kconfig, agora injetamos as flags
          KSU_KC="drivers/kernelsu/Kconfig"
          
          # Garantimos que a CONFIG_KSU principal exista e adicionamos as de SUSFS
          # Usamos 'seed' para garantir que não duplique se o arquivo já existir
          cat <<EOF >> "$KSU_KC"

          config KSU
              bool "KernelSU support"
              default y

          config SUSFS
              bool "SUSFS Base"
              default y

          config KSU_NEXT
              bool "KernelSU-Next"
              default y

          config KSU_SUSFS
              bool "KSU SUSFS"
              default y

          config SUSFS_HMAC_SIG
              bool "SUSFS HMAC"
              default y

          config SUSFS_SPOOF_UNAME
              bool "SUSFS SPOOF UNAME"
              default y

          config SUSFS_HIDE_KSU
              bool "SUSFS HIDE KSU"
              default y

          config SUSFS_HIDE_SUSFS
              bool "SUSFS HIDE SUSFS"
              default y

          config SUSFS_TRY_UMOUNT
              bool "SUSFS TRY UMOUNT"
              default y

          config SUSFS_SPOOF_DEV_ST_INO_FOR_KSU
              bool "SUSFS SPOOF DEV"
              default y
          EOF

          echo "=== 5. Aplicando Patch Base SUSFS 5.4 ==="
          curl -fLSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/Patch/susfs_patch_to_5.4.patch" -o susfs_5.4.patch
          patch -p1 < susfs_5.4.patch

          echo "=== 6. Aplicando Hooks Inline SUSFS ==="
          curl -fLSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/susfs_inline_hook_patches.sh" | bash

          echo "=== 7. Garantindo Headers do KSU ==="
          # No sidex15 legacy, ksu_susfs.h costuma estar em drivers/kernelsu/
          cp -v drivers/kernelsu/ksu_susfs.h include/linux/ || cp -v drivers/kernelsu/kernel/ksu_susfs.h include/linux/ || true

          echo "=== 8. Corrigindo strncpy e Incompatibilidades 5.4 ==="
          # Corrige o erro de declaração implícita da função susfs_add_try_umount
          find drivers/kernelsu -name "supercalls.c" -exec sed -i 's/susfs_add_try_umount/add_try_umount/g' {} +
          
          # Mantém os outros fixes que já estavam lá...
          find drivers/kernelsu -type f -name "*.c" -exec sed -i 's/strncpy_from_unsafe_user/strncpy_from_user_nofault/g' {} + || true
          
          # Fixes de código (buscando em drivers/kernelsu/ e drivers/kernelsu/kernel/)
          find drivers/kernelsu -name "allowlist.c" -exec sed -i '1i #include <linux/sched/task.h>' {} +
          find drivers/kernelsu -name "allowlist.c" -exec sed -i 's/TWA_RESUME/true/g' {} +
          find drivers/kernelsu -name "app_profile.c" -exec sed -i '/filter_count/d' {} +
          find drivers/kernelsu -type f -name "*.c" -exec sed -i 's/<linux\/pgtable.h>/<asm\/pgtable.h>/g' {} +

          echo "=== 9. Commit das alterações ==="
          git config --global user.email "bot@github.com"
          git config --global user.name "GitHub Actions"
          git add .
          git commit -m "Integrate sidex15 KSU-Next (Stable Base + Legacy Overwrite) & SUSFS 5.4 Fixes"
          
      - name: Download AOSP Clang r547379
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/clang
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz" -o /tmp/clang.tar.gz
          tar -xzf /tmp/clang.tar.gz -C $HOME/clang
          rm /tmp/clang.tar.gz

      - name: Add Clang to PATH
        run: echo "$HOME/clang/bin" >> $GITHUB_PATH

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      - name: Configure ccache
        run: |
          ccache -M 5G
          ccache -o compression=true
          ccache -o compiler_check=content
          ccache -z
          echo "=== ccache config ==="
          ccache -p | grep -E "max_size|compression"

      - name: Verify toolchain
        run: |
          echo "=== Clang version ==="
          clang --version
          echo "=== LLD version ==="
          ld.lld --version || true
          echo "=== Tools ==="
          which clang ld.lld llvm-ar llvm-nm llvm-objcopy || true

      - name: Generate defconfig
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            stone_defconfig

      - name: Configure kernel options
        run: |
          scripts/config --file out/.config \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_NEXT \
            --enable CONFIG_KSU_SUSFS \
            --enable CONFIG_SUSFS \
            --enable CONFIG_SUSFS_HMAC_SIG \
            --enable CONFIG_SUSFS_SPOOF_UNAME \
            --enable CONFIG_SUSFS_HIDE_KSU \
            --enable CONFIG_SUSFS_HIDE_SUSFS \
            --enable CONFIG_SUSFS_TRY_UMOUNT \
            --enable CONFIG_SUSFS_SPOOF_DEV_ST_INO_FOR_KSU

          scripts/config --file out/.config \
            --enable CONFIG_COMPAT_VDSO \
            --enable CONFIG_SHADOW_CALL_STACK \
            --enable CONFIG_SHADOW_CALL_STACK_VMAP \
            --enable CONFIG_LTO_CLANG \
            --disable CONFIG_LTO_NONE \
            --disable CONFIG_CFI_CLANG \
            --enable CONFIG_RELR \
            --enable CONFIG_THINLTO
            
          make O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

      - name: Verify kernel config
        run: |
          echo "=== Verificando Configurações Críticas ==="
          # Mostra o status atual das flags no log para depuração
          grep -E "CONFIG_KSU|CONFIG_SUSFS|CONFIG_LTO|CONFIG_CFI|CONFIG_SHADOW_CALL_STACK" out/.config || true
          
          echo ""
          # Lista de flags que DEVEM estar como 'y'
          declare -A expected=(
            ["CONFIG_KSU"]=y
            ["CONFIG_KSU_NEXT"]=y
            ["CONFIG_KSU_SUSFS"]=y
            ["CONFIG_SUSFS"]=y
            ["CONFIG_SUSFS_HMAC_SIG"]=y
            ["CONFIG_SUSFS_SPOOF_UNAME"]=y
            ["CONFIG_SUSFS_HIDE_KSU"]=y
            ["CONFIG_SUSFS_HIDE_SUSFS"]=y
            ["CONFIG_SUSFS_TRY_UMOUNT"]=y
            ["CONFIG_SUSFS_SPOOF_DEV_ST_INO_FOR_KSU"]=y
            ["CONFIG_COMPAT_VDSO"]=y
            ["CONFIG_SHADOW_CALL_STACK"]=y
            ["CONFIG_LTO_CLANG"]=y
            ["CONFIG_THINLTO"]=y
          )

          # Lista de flags que DEVEM estar desativadas
          declare -A disabled=(
            ["CONFIG_CFI_CLANG"]=1
            ["CONFIG_LTO_NONE"]=1
          )

          errors=0

          echo "--- Checando Flags Ativas ---"
          for cfg in "${!expected[@]}"; do
            if grep -q "${cfg}=y" out/.config; then
              echo "✅ ${cfg} está ativado"
            else
              echo "❌ ERRO: ${cfg} NÃO está ativado!"
              errors=$((errors + 1))
            fi
          done

          echo "--- Checando Flags Desativadas ---"
          for cfg in "${!disabled[@]}"; do
            if grep -q "${cfg}=y" out/.config; then
              echo "❌ ERRO: ${cfg} deveria estar desativado, mas está ATIVO!"
              errors=$((errors + 1))
            else
              echo "✅ ${cfg} está desativado"
            fi
          done

          if [ $errors -gt 0 ]; then
            echo ""
            echo "❌ Total de erros encontrados: $errors"
            echo "A build foi interrompida porque o kernel não foi configurado corretamente."
            exit 1
          fi
          echo "✅ Todas as configurações validadas com sucesso!"

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          echo "" > .scmversion
          make O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            -j$(nproc --all) \
            2>&1 | tee build.log

      - name: Print ccache stats
        if: always()
        run: ccache -s

      - name: Check build status
        run: |
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "❌ Kernel build failed! Image not found."
            echo ""
            echo "=== Last 100 lines of build log ==="
            tail -100 build.log
            exit 1
          fi
          echo "✅ Kernel built successfully!"
          
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-completo-${{ github.sha }}
          path: build.log
          retention-days: 7
          
      - name: Package with AnyKernel3
        run: |
          # 1. Baixar o seu AnyKernel3
          git clone https://github.com/NICKZZIN/ANYKERNEL3-C137 AK3
          
          # 2. Copiar a Image principal
          cp out/arch/arm64/boot/Image AK3/
          
          # 3. Copiar dtbo.img se o seu kernel tiver gerado
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img AK3/
          fi
          
          # 4. Copiar os arquivos .dtb
          if ls out/arch/arm64/boot/dts/vendor/qcom/*.dtb 1>/dev/null 2>&1; then
            cp out/arch/arm64/boot/dts/vendor/qcom/*.dtb AK3/dtb/ || true
          elif ls out/arch/arm64/boot/dts/vendor/xiaomi/*.dtb 1>/dev/null 2>&1; then
            cp out/arch/arm64/boot/dts/vendor/xiaomi/*.dtb AK3/dtb/ || true
          fi
          
          # 5. Limpar arquivos desnecessários (para o GitHub zipar apenas o que importa)
          rm -rf AK3/.git AK3/README.md AK3/*placeholder

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-C137-KSU
          path: AK3/
          retention-days: 30
