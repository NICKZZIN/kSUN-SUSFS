name: Build Kernel

on:
  push:
    branches: [ lineage-23.2 ]
  workflow_dispatch:
    inputs:
      ksu_type:
        description: 'Qual versão do KernelSU incluir?'
        required: true
        type: choice
        options:
          - None
          - KernelSU (Oficial)
          - KernelSU-Next
        default: 'None'

env:
  KSU_TYPE: ${{ github.event.inputs.ksu_type || 'None' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            git gnupg gperf libelf-dev libncurses5-dev \
            libssl-dev python3 python-is-python3 zip \
            android-sdk-libsparse-utils \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Cache Clang toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/clang
          key: clang-r547379

      - name: Install mkdtimg
        run: |
          git clone https://android.googlesource.com/platform/system/libufdt /tmp/libufdt
          sudo cp /tmp/libufdt/utils/src/mkdtboimg.py /usr/local/bin/mkdtimg
          sudo chmod +x /usr/local/bin/mkdtimg

      - name: Setup KernelSU / KernelSU-Next & Non-Kprobes
        if: env.KSU_TYPE != 'None'
        run: |
          if [ "$KSU_TYPE" == "KernelSU (Oficial)" ]; then
            echo "✅ Baixando KernelSU Oficial (tiann)..."
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s
            echo "🔧 Injetando Makefile.ext no Makefile raiz..."
            sed -i '/^all:/i -include $(srctree)/KernelSU/kernel/Makefile.ext\n' Makefile
          
          elif [ "$KSU_TYPE" == "KernelSU-Next" ]; then
            echo "✅ Baixando KernelSU-Next..."
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s
            echo "🔧 Injetando Makefile.ext no Makefile raiz..."
            sed -i '/^all:/i -include $(srctree)/KernelSU-Next/kernel/Makefile.ext\n' Makefile
          fi

          echo "📝 Criando arquivo de patch Non-Kprobes (À prova de falhas de espaço)..."
          cat << 'EOF' > ksu-hooks.patch
          --- a/fs/exec.c
          +++ b/fs/exec.c
          @@ -1890,6 +1890,14 @@
          _	return retval;
          _}
          _
          +#ifdef CONFIG_KSU
          +extern bool ksu_execveat_hook __read_mostly;
          +extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv,
          +			void *envp, int *flags);
          +extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr,
          +				 void *argv, void *envp, int *flags);
          +#endif
          +
          _static int do_execveat_common(int fd, struct filename *filename,
          _			      struct user_arg_ptr argv,
          _			      struct user_arg_ptr envp,
          _			      int flags)
          _{
          +   #ifdef CONFIG_KSU
          +	if (unlikely(ksu_execveat_hook))
          +		ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
          +	else
          +		ksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);
          +   #endif
          _	return __do_execve_file(fd, filename, argv, envp, flags, NULL);
          _}
          --- a/fs/open.c
          +++ b/fs/open.c
          @@ -348,6 +348,11 @@
          _	return ksys_fallocate(fd, mode, offset, len);
          _}
          _
          +#ifdef CONFIG_KSU
          +extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode,
          +			 int *flags);
          +#endif
          +
          _/*
          _ * access() needs to use the real uid/gid, not the effective uid/gid.
          _ * We do this by temporarily clearing all FS-related capabilities and
          @@ -355,6 +360,10 @@
          _ */
          _long do_faccessat(int dfd, const char __user *filename, int mode)
          _{
          _	const struct cred *old_cred;
          _	struct cred *override_cred;
          _	struct path path;
          _	struct inode *inode;
          _	struct vfsmount *mnt;
          _	int res;
          _	unsigned int lookup_flags = LOOKUP_FOLLOW;
          +
          +   #ifdef CONFIG_KSU
          +	ksu_handle_faccessat(&dfd, &filename, &mode, NULL);
          +   #endif
          _
          _	if (mode & ~S_IRWXO)	/* where's F_OK, X_OK, W_OK, R_OK? */
          _		return -EINVAL;
          --- a/fs/read_write.c
          +++ b/fs/read_write.c
          @@ -434,6 +434,12 @@
          _}
          _EXPORT_SYMBOL(kernel_read);
          _
          +#ifdef CONFIG_KSU
          +extern bool ksu_vfs_read_hook __read_mostly;
          +extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr,
          +			size_t *count_ptr, loff_t **pos);
          +#endif
          +
          _ssize_t vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos)
          _{
          _	ssize_t ret;
          _
          +   #ifdef CONFIG_KSU 
          +	if (unlikely(ksu_vfs_read_hook))
          +		ksu_handle_vfs_read(&file, &buf, &count, &pos);
          +   #endif
          +
          _	if (!(file->f_mode & FMODE_READ))
          _		return -EBADF;
          _	if (!(file->f_mode & FMODE_CAN_READ))
          --- a/fs/stat.c
          +++ b/fs/stat.c
          @@ -148,6 +148,10 @@
          _}
          _EXPORT_SYMBOL(vfs_statx_fd);
          _
          +#ifdef CONFIG_KSU
          +extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
          +#endif
          +
          _/**
          _ * vfs_statx - Get basic and extra attributes by filename
          _ * @dfd: A file descriptor representing the base dir for a relative filename
          @@ -170,6 +174,10 @@
          _	int error = -EINVAL;
          _	unsigned int lookup_flags = LOOKUP_FOLLOW | LOOKUP_AUTOMOUNT;
          _
          +   #ifdef CONFIG_KSU
          +	ksu_handle_stat(&dfd, &filename, &flags);
          +   #endif
          +
          _	if ((flags & ~(AT_SYMLINK_NOFOLLOW | AT_NO_AUTOMOUNT |
          _		       AT_EMPTY_PATH | KSTAT_QUERY_FLAGS)) != 0)
          _		return -EINVAL;
          --- a/drivers/input/input.c
          +++ b/drivers/input/input.c
          @@ -367,6 +367,11 @@
          _	return disposition;
          _}
          _
          +#ifdef CONFIG_KSU
          +extern bool ksu_input_hook __read_mostly;
          +extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);
          +#endif
          +
          _static void input_handle_event(struct input_dev *dev,
          _			       unsigned int type, unsigned int code, int value)
          _{
          _	int disposition = input_get_disposition(dev, type, code, &value);
          _
          +   #ifdef CONFIG_KSU
          +	if (unlikely(ksu_input_hook))
          +		ksu_handle_input_handle_event(&type, &code, &value);
          +   #endif
          +
          _	if (disposition != INPUT_IGNORE_EVENT && type != EV_SYN)
          _		add_input_randomness(type, code, value);
          --- a/fs/devpts/inode.c
          +++ b/fs/devpts/inode.c
          @@ -602,6 +602,10 @@
          _       return dentry;
          _}
          _
          +#ifdef CONFIG_KSU
          +extern int ksu_handle_devpts(struct inode*);
          +#endif
          +
          _/**
          _ * devpts_get_priv -- get private data for a slave
          _ * @pts_inode: inode of the slave
          @@ -610,6 +614,10 @@
          _ */
          _void *devpts_get_priv(struct dentry *dentry)
          _{
          +       #ifdef CONFIG_KSU
          +       ksu_handle_devpts(dentry->d_inode);
          +       #endif
          +
          _       if (dentry->d_sb->s_magic != DEVPTS_SUPER_MAGIC)
          _               return NULL;
          _       return dentry->d_fsdata;
          --- a/fs/namespace.c
          +++ b/fs/namespace.c
          @@ -1739,6 +1739,44 @@
          _}
          _#endif
          _
          +static int can_umount(const struct path *path, int flags)
          +{
          +	struct mount *mnt = real_mount(path->mnt);
          +
          +	if (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))
          +		return -EINVAL;
          +	if (!may_mount())
          +		return -EPERM;
          +	if (path->dentry != path->mnt->mnt_root)
          +		return -EINVAL;
          +	if (!check_mnt(mnt))
          +		return -EINVAL;
          +	if (mnt->mnt.mnt_flags & MNT_LOCKED) /* Check optimistically */
          +		return -EINVAL;
          +	if (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))
          +		return -EPERM;
          +	return 0;
          +}
          +
          +int path_umount(struct path *path, int flags)
          +{
          +	struct mount *mnt = real_mount(path->mnt);
          +	int ret;
          +
          +	ret = can_umount(path, flags);
          +	if (!ret)
          +		ret = do_umount(mnt, flags);
          +
          +	/* we must not call path_put() as that would clear mnt_expiry_mark */
          +	dput(path->dentry);
          +	mntput_no_expire(mnt);
          +	return ret;
          +}
          +
          _/*
          _ * Now umount can handle mount points as well as block devices.
          _ * This is important for filesystems which use unnamed block devices.
          EOF
          
          # Mágica: Troca os sublinhados por espaços em branco reais
          sed -i 's/^_/ /' ksu-hooks.patch

          echo "🚀 Aplicando Hooks Non-Kprobes no código do Kernel..."
          patch -p1 --fuzz=3 --no-backup-if-mismatch < ksu-hooks.patch
          echo "✅ Hooks Non-Kprobes aplicados com sucesso!"

      - name: Download AOSP Clang r547379
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/clang
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz" -o /tmp/clang.tar.gz
          tar -xzf /tmp/clang.tar.gz -C $HOME/clang
          rm /tmp/clang.tar.gz

      - name: Add Clang to PATH
        run: echo "$HOME/clang/bin" >> $GITHUB_PATH

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      - name: Configure ccache
        run: |
          ccache -M 5G
          ccache -o compression=true
          ccache -o compiler_check=content
          ccache -z
          echo "=== ccache config ==="
          ccache -p | grep -E "max_size|compression"

      - name: Verify toolchain
        run: |
          echo "=== Clang version ==="
          clang --version
          echo "=== LLD version ==="
          ld.lld --version || true
          echo "=== Tools ==="
          which clang ld.lld llvm-ar llvm-nm llvm-objcopy || true

      - name: Generate defconfig
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            stone_defconfig

      - name: Configure kernel options
        run: |
          scripts/config --file out/.config \
            --enable CONFIG_COMPAT_VDSO \
            --enable CONFIG_SHADOW_CALL_STACK \
            --enable CONFIG_SHADOW_CALL_STACK_VMAP \
            --enable CONFIG_LTO_CLANG \
            --disable CONFIG_LTO_NONE \
            --disable CONFIG_CFI_CLANG \
            --enable CONFIG_RELR \
            --enable CONFIG_THINLTO

          if [ "$KSU_TYPE" != "None" ]; then
            echo "🔧 Configurando KernelSU em modo Non-Kprobes no .config..."
            scripts/config --file out/.config \
              --enable CONFIG_MODULES \
              --enable CONFIG_MODULE_UNLOAD \
              --disable CONFIG_KPROBES \
              --disable CONFIG_HAVE_KPROBES \
              --disable CONFIG_KPROBE_EVENTS
          fi

          make O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

      - name: Verify kernel config
        run: |
          echo "=== Checking critical configs ==="
          grep -E "CONFIG_COMPAT_VDSO|CONFIG_SHADOW_CALL_STACK|CONFIG_SHADOW_CALL_STACK_VMAP|CONFIG_LTO_CLANG|CONFIG_LTO_NONE|CONFIG_CFI_CLANG|CONFIG_RELR|CONFIG_THINLTO|CONFIG_KPROBES" out/.config || true

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            -j$(nproc --all) \
            2>&1 | tee build.log

      - name: Print ccache stats
        if: always()
        run: ccache -s

      - name: Check build status
        run: |
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "❌ Kernel build failed! Image not found."
            echo ""
            echo "=== Last 100 lines of build log ==="
            tail -100 build.log
            exit 1
          fi
          echo "✅ Kernel built successfully!"
          
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-completo-${{ github.sha }}
          path: build.log
          retention-days: 7
          
      - name: Package with AnyKernel3
        run: |
          echo "📦 Baixando seu repositório AnyKernel3..."
          git clone https://github.com/NICKZZIN/ANYKERNEL3-C137 AnyKernel3
          
          echo "Copiar Image..."
          cp out/arch/arm64/boot/Image AnyKernel3/
          
          echo "Copiar dtbo.img..."
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          fi
          
          echo "Unindo arquivos .dtb..."
          if ls out/arch/arm64/boot/dts/vendor/qcom/*.dtb 1>/dev/null 2>&1; then
            cat out/arch/arm64/boot/dts/vendor/qcom/*.dtb > AnyKernel3/dtb
          elif ls out/arch/arm64/boot/dts/vendor/xiaomi/*.dtb 1>/dev/null 2>&1; then
            cat out/arch/arm64/boot/dts/vendor/xiaomi/*.dtb > AnyKernel3/dtb
          fi
          
          echo "Limpando lixo do repositório..."
          rm -rf AnyKernel3/.git AnyKernel3/README.md AnyKernel3/*placeholder

      - name: Upload kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: C137-KERNEL-V1-${{ env.KSU_TYPE }}-${{ github.sha }}
          path: AnyKernel3/*
          retention-days: 30
