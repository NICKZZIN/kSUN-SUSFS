name: Build Kernel

on:
  push:
    branches: [ lineage-23.2 ]
  workflow_dispatch:
    inputs:
      ksu_type:
        description: 'Qual versão do KernelSU incluir?'
        required: true
        type: choice
        options:
          - None
          - KernelSU
          - KernelSU-Next
        default: 'None'

env:
  # Se rodar por push automático, o padrão será "None". Se rodar manual, usa a escolha do menu.
  KSU_TYPE: ${{ github.event.inputs.ksu_type || 'None' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            git gnupg gperf libelf-dev libncurses5-dev \
            libssl-dev python3 python-is-python3 zip \
            android-sdk-libsparse-utils \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Cache Clang toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/clang
          key: clang-r547379

      - name: Install mkdtimg
        run: |
          git clone https://android.googlesource.com/platform/system/libufdt /tmp/libufdt
          sudo cp /tmp/libufdt/utils/src/mkdtboimg.py /usr/local/bin/mkdtimg
          sudo chmod +x /usr/local/bin/mkdtimg

      - name: Setup KernelSU / KernelSU-Next
        if: env.KSU_TYPE != 'None'
        run: |
          if [ "$KSU_TYPE" == "KernelSU" ]; then
            echo "✅ Aplicando patch do KernelSU (Julival)..."
            curl -LSs "https://raw.githubusercontent.com/bittencourtjulival/KernelSU/master/kernel/setup.sh" | bash -s
          elif [ "$KSU_TYPE" == "KernelSU-Next" ]; then
            echo "✅ Aplicando patch do KernelSU-Next..."
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s
          fi

      - name: Download AOSP Clang r547379
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/clang
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz" -o /tmp/clang.tar.gz
          tar -xzf /tmp/clang.tar.gz -C $HOME/clang
          rm /tmp/clang.tar.gz

      - name: Add Clang to PATH
        run: echo "$HOME/clang/bin" >> $GITHUB_PATH

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      - name: Configure ccache
        run: |
          ccache -M 5G
          ccache -o compression=true
          ccache -o compiler_check=content
          ccache -z
          echo "=== ccache config ==="
          ccache -p | grep -E "max_size|compression"

      - name: Verify toolchain
        run: |
          echo "=== Clang version ==="
          clang --version
          echo "=== LLD version ==="
          ld.lld --version || true
          echo "=== Tools ==="
          which clang ld.lld llvm-ar llvm-nm llvm-objcopy || true

      - name: Generate defconfig
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            stone_defconfig

      - name: Configure kernel options
        run: |
          # Opções padrão do Kernel
          scripts/config --file out/.config \
            --enable CONFIG_COMPAT_VDSO \
            --enable CONFIG_SHADOW_CALL_STACK \
            --enable CONFIG_SHADOW_CALL_STACK_VMAP \
            --enable CONFIG_LTO_CLANG \
            --disable CONFIG_LTO_NONE \
            --disable CONFIG_CFI_CLANG \
            --enable CONFIG_RELR \
            --enable CONFIG_THINLTO

          # Injetar opções do KernelSU se o usuário selecionou algum
          if [ "$KSU_TYPE" != "None" ]; then
            echo "🔧 Injetando configurações do $KSU_TYPE no .config..."
            scripts/config --file out/.config \
              --enable CONFIG_KPROBES \
              --enable CONFIG_HAVE_KPROBES \
              --enable CONFIG_KPROBE_EVENTS \
              --enable CONFIG_MODULES \
              --enable CONFIG_MODULE_UNLOAD
          fi

          # Resolve dependências e limpa o config
          make O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

      - name: Verify kernel config
        run: |
          echo "=== Checking critical configs ==="
          grep -E "CONFIG_COMPAT_VDSO|CONFIG_SHADOW_CALL_STACK|CONFIG_SHADOW_CALL_STACK_VMAP|CONFIG_LTO_CLANG|CONFIG_LTO_NONE|CONFIG_CFI_CLANG|CONFIG_RELR|CONFIG_THINLTO|CONFIG_KPROBES" out/.config || true

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            -j$(nproc --all) \
            2>&1 | tee build.log

      - name: Print ccache stats
        if: always()
        run: ccache -s

      - name: Check build status
        run: |
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "❌ Kernel build failed! Image not found."
            echo ""
            echo "=== Last 100 lines of build log ==="
            tail -100 build.log
            exit 1
          fi
          echo "✅ Kernel built successfully!"
          
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-completo-${{ github.sha }}
          path: build.log
          retention-days: 7
          
      - name: Package with AnyKernel3
        run: |
          echo "📦 Baixando seu repositório AnyKernel3..."
          git clone https://github.com/NICKZZIN/ANYKERNEL3-C137 AnyKernel3
          
          echo "Copiar Image..."
          cp out/arch/arm64/boot/Image AnyKernel3/
          
          echo "Copiar dtbo.img (se existir)..."
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          fi
          
          echo "Unindo e copiando os arquivos .dtb..."
          if ls out/arch/arm64/boot/dts/vendor/qcom/*.dtb 1>/dev/null 2>&1; then
            cat out/arch/arm64/boot/dts/vendor/qcom/*.dtb > AnyKernel3/dtb
          elif ls out/arch/arm64/boot/dts/vendor/xiaomi/*.dtb 1>/dev/null 2>&1; then
            cat out/arch/arm64/boot/dts/vendor/xiaomi/*.dtb > AnyKernel3/dtb
          fi
          
          echo "Compactando o ZIP instalável..."
          cd AnyKernel3
          zip -r9 "../C137-KERNEL V1.zip" * -x .git README.md *placeholder

      - name: Upload kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: C137-KERNEL-V1-${{ env.KSU_TYPE }}-${{ github.sha }}
          path: "C137-KERNEL V1.zip"
          retention-days: 30
